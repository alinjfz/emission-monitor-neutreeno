services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: sqlite:////data/emissions.db
      FRONTEND_DIST: /app/frontend/dist
      COOKIE_SECURE: "false"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - emissions_data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  emissions_data:
